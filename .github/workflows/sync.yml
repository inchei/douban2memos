name: sync-memos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      watermark:
        description: "初始水印（epoch 秒，可选）：填本地首次同步生成的 state.json 的 last_updated_ts，让首次运行直接走增量"
        required: false
        type: string
        default: ""
      full:
        description: "强制全量扫描本次（如刚接入一个空的 memos 实例）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    name: 同步豆瓣收藏到 Memos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复增量状态（cache，不进仓库）
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: douban2memos-state-${{ github.run_id }}
          restore-keys: douban2memos-state-

      - name: 写入初始水印（仅首次播种）
        if: inputs.watermark != '' && steps.restore.outputs.cache-hit != 'true'
        run: |
          case "${{ inputs.watermark }}" in
            *[!0-9]*) echo "watermark 需为正整数（epoch 秒）" >&2; exit 1 ;;
          esac
          printf '{\n  "last_updated_ts": %s\n}\n' "${{ inputs.watermark }}" > state.json

      - name: 同步
        env:
          DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
          MEMOS_API: ${{ secrets.MEMOS_API }}
          MEMOS_USER: ${{ secrets.MEMOS_USER }}
          MEMOS_PASSWORD: ${{ secrets.MEMOS_PASSWORD }}
          MEMOS_TOKEN: ${{ secrets.MEMOS_TOKEN }}
          VARS_VISIBILITY: ${{ vars.MEMOS_VISIBILITY }}
          VARS_TAG: ${{ vars.MEMOS_TAG }}
          SECRETS_VISIBILITY: ${{ secrets.MEMOS_VISIBILITY }}
          SECRETS_TAG: ${{ secrets.MEMOS_TAG }}
          VARS_NEODB: ${{ vars.NEODB }}
          VARS_NEODB_BASE: ${{ vars.NEODB_BASE }}
          SECRETS_NEODB: ${{ secrets.NEODB }}
          SECRETS_NEODB_BASE: ${{ secrets.NEODB_BASE }}
        run: |
          set -euo pipefail
          if [ -z "$DOUBAN_USER_ID" ] || [ -z "$MEMOS_API" ]; then
            echo "未配置 secrets（DOUBAN_USER_ID / MEMOS_API），跳过本次同步。"
            exit 0
          fi
          args=(--douban-user-id "$DOUBAN_USER_ID" --api "$MEMOS_API")
          if [ -n "$MEMOS_TOKEN" ]; then
            args+=(--token "$MEMOS_TOKEN")
          else
            args+=(--user "$MEMOS_USER" --password "$MEMOS_PASSWORD")
          fi
          [ "${{ inputs.full }}" = "true" ] && args+=(--full)
          # 可见性 / 标签：由 Variables/Secrets 控制（Secrets 优先）
          VISIBILITY="${SECRETS_VISIBILITY:-$VARS_VISIBILITY}"
          if [ -n "$VISIBILITY" ]; then
            case "$VISIBILITY" in
              private|protected|public) ;;
              *) echo "visibility 需为 private/protected/public，当前为 '$VISIBILITY'" >&2; exit 1 ;;
            esac
            args+=(--visibility "$VISIBILITY")
          fi
          TAG="${SECRETS_TAG:-$VARS_TAG}"
          if [ -n "$TAG" ]; then
            args+=(--tag "$TAG")
          fi
          # NeoDB 转换：由 Variables/Secrets 控制（Secrets 优先）
          NEODB="${SECRETS_NEODB:-$VARS_NEODB}"
          NEODB_BASE="${SECRETS_NEODB_BASE:-$VARS_NEODB_BASE}"
          NEODB_LC="$(printf '%s' "$NEODB" | tr '[:upper:]' '[:lower:]')"
          if [ "$NEODB_LC" = "true" ] || [ "$NEODB_LC" = "1" ] || [ "$NEODB_LC" = "yes" ]; then
            args+=(--neodb)
            if [ -n "$NEODB_BASE" ]; then
              args+=(--neodb-base "$NEODB_BASE")
            fi
          elif [ -n "$NEODB_BASE" ]; then
            args+=(--neodb --neodb-base "$NEODB_BASE")
          fi
          python3 douban2memos.py "${args[@]}"

      - name: 保存增量状态（cache）
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: douban2memos-state-${{ github.run_id }}